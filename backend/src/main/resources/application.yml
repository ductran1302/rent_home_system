server:
  port: 8080

spring:
  application:
    name: ruinhome-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ruinhome}
    username: ${DB_USERNAME:ruinhome}
    password: ${DB_PASSWORD:ruinhome}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

ruinhome:
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    secret: ${JWT_SECRET:ruinhome-dev-secret-change-me-in-production-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.ruinhome: INFO
