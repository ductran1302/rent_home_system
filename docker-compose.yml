services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ruinhome
      POSTGRES_USER: ruinhome
      POSTGRES_PASSWORD: ruinhome
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ruinhome -d ruinhome"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ruinhome
      DB_USERNAME: ruinhome
      DB_PASSWORD: ruinhome
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-ruinhome-dev-secret-change-me-in-production-0123456789}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata:
  uploads:
